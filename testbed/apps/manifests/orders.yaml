apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/version: "1.3.0"
  annotations:
    kubernetes.io/change-cause: "release orders v1.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/version: "1.3.0"
    spec:
      containers:
        - name: orders
          image: shop/orders:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PAYMENTS_URL
              value: http://payments.shop.svc.cluster.local:8000
            - name: REDIS_URL
              value: redis://redis.shop.svc.cluster.local:6379/0
          # Memory limit is deliberately tight: the OOM scenario's unbounded order
          # cache must hit the ceiling within a few minutes of normal load.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: orders
  ports:
    - port: 8000
      targetPort: http
      name: http
