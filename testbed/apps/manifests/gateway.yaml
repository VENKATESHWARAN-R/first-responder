apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shop
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/version: "1.3.0"
  annotations:
    kubernetes.io/change-cause: "release gateway v1.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/version: "1.3.0"
    spec:
      containers:
        - name: gateway
          image: shop/gateway:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: CATALOG_URL
              value: http://catalog.shop.svc.cluster.local:8000
            - name: ORDERS_URL
              value: http://orders.shop.svc.cluster.local:8000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: shop
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: shop
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - port: 8000
      targetPort: http
      nodePort: 30080
      name: http
