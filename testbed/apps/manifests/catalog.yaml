apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/version: "1.3.0"
  annotations:
    kubernetes.io/change-cause: "release catalog v1.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/version: "1.3.0"
    spec:
      containers:
        - name: catalog
          image: shop/catalog:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: REDIS_URL
              value: redis://redis.shop.svc.cluster.local:6379/0
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: catalog
  ports:
    - port: 8000
      targetPort: http
      name: http
