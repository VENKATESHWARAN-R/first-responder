# Cluster shape for the testbed. See README.md in this directory.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: first-responder
nodes:
  - role: control-plane
    # Expose the gateway's NodePort (30080) on the host as http://localhost:8080.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
